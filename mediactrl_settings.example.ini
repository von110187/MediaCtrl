; MediaCtrl per-PC settings. Copied to mediactrl_settings.ini on first run;
; edit that copy (it's gitignored), then reload the script.
; Switches take 1/0 (or on/off, yes/no). Anything missing or unreadable keeps
; the default shown here. Keep this file ASCII.
; The video features (auto-fullscreen, page leveler, video keys, F6, F7) are
; always on and need nothing here.

[lossless]
; Lossless Scaling follows video fullscreen. Needs Lossless Scaling installed,
; with its scaling hotkey set to the key below.
enabled=0
hotkey={F1}

[keys]
; PgUp/PgDn and F13/F14 -> Windows volume
volume=0
; Home/End -> F15/F16 (e.g. Twinkle Tray brightness hotkeys)
brightness=0
; Play/Pause -> Spotify play/pause, Next -> Spotify PREVIOUS, Insert -> Spotify next
spotify=0
; Media_Prev -> shut the PC down immediately, no prompt
shutdown=0

[spotify]
; skip a track whose last 10 s are silent (needs the Spotify desktop app)
outroSkip=1
; Spotify.exe path, only if it can't be found automatically
exePath=

[speaker]
; Harman Kardon speaker: bass EQ preset on while one of the games is running
; (Peace / Equalizer APO with Ctrl+Alt+F11 = bass off, Ctrl+Alt+F12 = bass on)
harmanBass=0
peacePath=
; comma-separated process names, without .exe
games=

; Keep the speaker awake: speakers like the Harman Kardon SoundSticks 4 go to
; standby after ~10 min of silence. This plays a short tone every
; keepAwakeMinutes while nothing else is playing. 19 kHz is above what most
; adults hear (children and pets may hear it). Still sleeps? raise keepAwakeDb
; (e.g. -14). Hear it? lower it, or try a low tone (keepAwakeHz=20, keepAwakeDb=-12).
keepAwake=0
keepAwakeMinutes=5
keepAwakeHz=19000
keepAwakeDb=-20

[leveler]
; every video's loudness (dB); the - / = keys change and save this
targetDb=-20
